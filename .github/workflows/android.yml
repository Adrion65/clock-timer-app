name: Build Android app

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - 'android-app/**'
      - '.github/workflows/android.yml'

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Find the Android folder
        id: find
        shell: bash
        run: |
          DIR=$(dirname "$(find . -maxdepth 3 -name capacitor.config.json -not -path '*/node_modules/*' | head -1)")
          echo "Android project folder: $DIR"
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install tools
        working-directory: ${{ steps.find.outputs.dir }}
        run: npm install

      - name: Create the Android project
        working-directory: ${{ steps.find.outputs.dir }}
        run: |
          npx cap add android
          npx cap sync android

      - name: Keep the screen on while the app is open
        working-directory: ${{ steps.find.outputs.dir }}
        run: |
          FILE=$(find android/app/src/main/java -name MainActivity.java | head -1)
          cat > "$FILE" <<'JAVA'
          package com.clocktimer.app;

          import android.os.Bundle;
          import android.view.WindowManager;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
            @Override
            public void onCreate(Bundle savedInstanceState) {
              super.onCreate(savedInstanceState);
              getWindow().addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);
            }
          }
          JAVA
          cat "$FILE"

      - name: Lock the screen to landscape
        working-directory: ${{ steps.find.outputs.dir }}
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          sed -i '0,/<activity/s//<activity android:screenOrientation="sensorLandscape"/' "$MANIFEST"
          grep -n "screenOrientation" "$MANIFEST"

      - name: Build the APK
        working-directory: ${{ steps.find.outputs.dir }}/android
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Name the file
        working-directory: ${{ steps.find.outputs.dir }}
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Clock-Timer.apk

      - name: Keep the finished app
        uses: actions/upload-artifact@v7
        with:
          name: Clock-Timer-Android
          path: ${{ steps.find.outputs.dir }}/Clock-Timer.apk
          if-no-files-found: error
