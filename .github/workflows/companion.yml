name: Build Companion module

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - 'companion-module-clocktimer-app/**'
      - '.github/workflows/companion.yml'

jobs:
  module:
    name: Companion module package
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: companion-module-clocktimer-app
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install tools
        run: npm install

      - name: Build the module package
        run: npm run package

      - name: Name the file
        run: |
          ls -la
          # The build tool leaves a pkg folder and, depending on its version, also a .tgz.
          # If there is no .tgz, pack the pkg folder ourselves (this is the format Companion loads).
          FILE=$(ls *.tgz 2>/dev/null | head -1 || true)
          if [ -n "$FILE" ] && [ "$FILE" != "Clock-Timer-Companion-1.10.c.tgz" ]; then
            cp "$FILE" Clock-Timer-Companion-1.10.c.tgz
          elif [ -z "$FILE" ]; then
            test -f pkg/companion/manifest.json
            tar -czf Clock-Timer-Companion-1.10.c.tgz pkg
          fi
          tar -tzf Clock-Timer-Companion-1.10.c.tgz | head -20

      - name: Keep the finished module
        uses: actions/upload-artifact@v7
        with:
          name: Clock-Timer-Companion-1.10.c
          path: companion-module-clocktimer-app/Clock-Timer-Companion-1.10.c.tgz
          if-no-files-found: error
